<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handwritten Number Recognizer</title>
<style>
  :root { --bg:#f6f6f3; --fg:#1d1d1b; --muted:#6b6b66; --line:#d8d8d2; --accent:#2a5bd7; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.45 system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width: 980px; margin: 0 auto; padding: 32px 20px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); }
  canvas#pad { width:100%; aspect-ratio: 3/1; background:#fff; border:1px solid var(--line);
               border-radius:10px; touch-action:none; cursor:crosshair; display:block; }
  .bar { display:flex; gap:10px; margin:12px 0 24px; align-items:center; }
  button { font:inherit; padding:8px 16px; border-radius:8px; border:1px solid var(--line);
           background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  label { color:var(--muted); font-size:.9rem; display:flex; gap:6px; align-items:center; }
  .result { font-size: 3.5rem; font-weight: 650; letter-spacing: .08em; min-height: 1.2em;
            font-variant-numeric: tabular-nums; }
  .hint { color: var(--muted); }
  .digits { display:flex; flex-wrap:wrap; gap:12px; margin-top:12px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px; width:120px; text-align:center; }
  .card canvas { width:56px; height:56px; image-rendering:pixelated; background:#000; border-radius:4px; }
  .card .d { font-size:1.8rem; font-weight:650; }
  .card .c { font-size:.8rem; color:var(--muted); }
  .error { color:#b3261e; }
</style>
</head>
<body>
<main>
  <h1>Handwritten number recognizer</h1>
  <p class="sub">Draw one or more digits below with your mouse, trackpad or finger. Leave a small gap between digits.</p>

  <canvas id="pad" width="1200" height="400"></canvas>
  <div class="bar">
    <button class="primary" id="go">Recognize</button>
    <button id="clear">Clear</button>
    <label><input type="checkbox" id="auto" checked> Recognize as I draw</label>
  </div>

  <div class="result" id="result"><span class="hint" style="font-size:1rem">Your number will appear here.</span></div>
  <div class="digits" id="digits"></div>
</main>
<script>
const pad = document.getElementById('pad');
const ctx = pad.getContext('2d');
const resultEl = document.getElementById('result');
const digitsEl = document.getElementById('digits');
let drawing = false, last = null, timer = null, dirty = false;

function reset() {
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, pad.width, pad.height);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 22; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  dirty = false;
}
reset();

function pos(e) {
  const r = pad.getBoundingClientRect();
  return [(e.clientX - r.left) * pad.width / r.width, (e.clientY - r.top) * pad.height / r.height];
}
pad.addEventListener('pointerdown', e => {
  drawing = true; dirty = true; last = pos(e); pad.setPointerCapture(e.pointerId);
  ctx.beginPath(); ctx.arc(last[0], last[1], ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fillStyle = '#000'; ctx.fill();
  clearTimeout(timer);
});
pad.addEventListener('pointermove', e => {
  if (!drawing) return;
  const p = pos(e);
  ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(...p); ctx.stroke(); last = p;
});
const stop = () => {
  if (!drawing) return;
  drawing = false;
  if (document.getElementById('auto').checked) { clearTimeout(timer); timer = setTimeout(recognize, 600); }
};
pad.addEventListener('pointerup', stop);
pad.addEventListener('pointercancel', stop);

document.getElementById('clear').onclick = () => {
  reset(); digitsEl.innerHTML = '';
  resultEl.innerHTML = '<span class="hint" style="font-size:1rem">Your number will appear here.</span>';
};
document.getElementById('go').onclick = recognize;

async function recognize() {
  if (!dirty) return;
  try {
    const res = await fetch('/api/recognize', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({image: pad.toDataURL('image/png')})
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    show(data);
  } catch (err) {
    resultEl.innerHTML = `<span class="error" style="font-size:1rem">${err.message}</span>`;
  }
}

function show(data) {
  resultEl.textContent = data.number || '—';
  digitsEl.innerHTML = '';
  for (const d of data.digits) {
    const card = document.createElement('div'); card.className = 'card';
    const c = document.createElement('canvas'); c.width = c.height = 28;
    const img = c.getContext('2d').createImageData(28, 28);
    d.preview.flat().forEach((v, i) => { img.data.set([v, v, v, 255], i * 4); });
    c.getContext('2d').putImageData(img, 0, 0);
    const alt = d.alternatives.map(a => `${a.digit} ${(a.p * 100).toFixed(0)}%`).join(', ');
    card.innerHTML = `<div class="d">${d.digit}</div><div class="c">${(d.confidence * 100).toFixed(1)}% sure</div>`;
    card.prepend(c);
    card.insertAdjacentHTML('beforeend', `<div class="c">next: ${alt}</div>`);
    digitsEl.appendChild(card);
  }
}
</script>
</body>
</html>
